<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glowara | Checkout</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .checkout-page {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 25px;
        }

        .checkout-title {
            font-size: 30px;
            margin-bottom: 30px;
        }

        .checkout-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
        }

        .checkout-box {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .checkout-box h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .place-order-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 7px;
            background: #e91e63;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        .place-order-btn:hover {
            background: #111;
            transform: translateY(-2px);
        }

        .checkout-summary {
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .checkout-product {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .checkout-product img {
            width: 65px;
            height: 75px;
            object-fit: cover;
            border-radius: 6px;
        }

        .checkout-product-info {
            flex: 1;
        }

        .checkout-product-name {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .checkout-product-price {
            font-weight: bold;
        }

        .checkout-total {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        @media(max-width: 800px) {
            .checkout-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <main class="checkout-page">

        <h1 class="checkout-title">
            Checkout
        </h1>

        <div class="checkout-layout">

            <section>

                <div class="checkout-box">

                    <h2>Delivery Details</h2>

                    <form id="checkoutForm">

                        <div class="form-group">
                            <label>Full Name</label>
                            <input
                                type="text"
                                id="customerName"
                                required
                                placeholder="Enter your full name"
                            >
                        </div>

                        <div class="form-group">
                            <label>Mobile Number</label>
                            <input
                                type="tel"
                                id="customerPhone"
                                required
                                placeholder="Enter mobile number"
                            >
                        </div>

                        <div class="form-group">
                            <label>Email</label>
                            <input
                                type="email"
                                id="customerEmail"
                                required
                                placeholder="Enter email"
                            >
                        </div>

                        <div class="form-group">
                            <label>Delivery Address</label>
                            <textarea
                                id="customerAddress"
                                required
                                placeholder="Enter complete delivery address"
                            ></textarea>
                        </div>

                        <div class="form-group">
                            <label>City</label>
                            <input
                                type="text"
                                id="customerCity"
                                required
                                placeholder="Enter city"
                            >
                        </div>

                        <div class="form-group">
                            <label>Pincode</label>
                            <input
                                type="text"
                                id="customerPincode"
                                required
                                placeholder="Enter pincode"
                            >
                        </div>

                        <button
                            type="submit"
                            class="place-order-btn"
                        >
                            PLACE ORDER
                        </button>

                    </form>

                </div>

            </section>


            <aside class="checkout-box checkout-summary">

                <h2>Order Summary</h2>

                <div id="checkoutProducts"></div>

                <div class="checkout-total">
                    <span>Total</span>
                    <span id="checkoutTotal">₹0</span>
                </div>

            </aside>

        </div>

    </main>
    <script src="js/api.js"></script>
<script src="js/checkout.js"></script>


</body>
</html>
