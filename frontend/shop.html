<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glowara | Shop Beauty</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animation.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/components.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <style>

        .shop-page {
            max-width: 1300px;
            margin: auto;
            padding: 40px 25px 80px;
        }

        .shop-header {
            text-align: center;
            padding: 45px 20px;
            margin-bottom: 35px;
            background: linear-gradient(135deg, #fff1f6, #fde2ec);
            border-radius: 12px;
        }

        .shop-header span {
            color: #e83e8c;
            font-size: 11px;
            letter-spacing: 4px;
            font-weight: bold;
        }

        .shop-header h1 {
            font-size: 42px;
            margin: 12px 0;
        }

        .shop-header p {
            color: #777;
            font-size: 14px;
        }

        .shop-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            border: 1px solid #ddd;
            background: white;
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: .3s;
            font-size: 12px;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #111;
            color: white;
            border-color: #111;
        }

        .sort-select {
            padding: 10px 15px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }

        .shop-count {
            color: #777;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .shop-product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
        }

        .shop-product-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 12px;
            overflow: hidden;
            transition: .35s;
        }

        .shop-product-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 18px 40px rgba(0,0,0,.10);
        }

        .shop-product-image {
            position: relative;
            height: 330px;
            overflow: hidden;
            background: #f8f8f8;
        }

        .shop-product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: .5s;
        }

        .shop-product-card:hover
        .shop-product-image img {
            transform: scale(1.07);
        }

        .shop-product-info {
            padding: 17px;
        }

        .shop-brand {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .shop-name {
            font-size: 14px;
            margin: 7px 0;
            line-height: 1.4;
            min-height: 40px;
        }

        .shop-price {
            font-size: 17px;
            font-weight: bold;
        }

        .shop-old-price {
            text-decoration: line-through;
            color: #999;
            margin-left: 8px;
            font-size: 12px;
        }

        .shop-rating {
            margin-top: 8px;
            color: #e83e8c;
            font-size: 12px;
        }

        .shop-add-btn {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: none;
            background: #111;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: .3s;
        }

        .shop-add-btn:hover {
            background: #e83e8c;
        }

        .no-products {
            grid-column: 1 / -1;
            text-align: center;
            padding: 70px 20px;
            color: #777;
        }

        @media (max-width: 1000px) {

            .shop-product-grid {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media (max-width: 700px) {

            .shop-product-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .shop-header h1 {
                font-size: 32px;
            }

        }

        @media (max-width: 480px) {

            .shop-product-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <header class="header">

        <div class="header-main">

            <a href="index.html" class="logo">
                <span>G</span>LOWARA
            </a>

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    id="shopSearch"
                    placeholder="Search products..."
                >

                <button id="shopSearchBtn">
                    Search
                </button>

            </div>

            <div class="header-actions">

                <a href="login.html">
                    <i class="fa-regular fa-user"></i>
                    <span>Account</span>
                </a>

                <a href="cart.html">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span>Bag</span>
                    <b id="cartCount">0</b>
                </a>

            </div>

        </div>

        <nav class="navbar">

           <nav class="navbar">

    <a href="index.html">Home</a>

    <a href="shop.html?category=Makeup">
        Makeup
    </a>

    <a href="shop.html?category=Skincare">
        Skincare
    </a>

    <a href="shop.html?category=Haircare">
        Haircare
    </a>

    <a href="shop.html?category=Fragrance">
        Fragrance
    </a>

    <a href="shop.html?category=Bath%20%26%20Body">
        Bath & Body
    </a>

    <a href="shop.html?category=Wellness">
        Wellness
    </a>

</nav>

        </nav>

    </header>


    <main class="shop-page">

        <section class="shop-header">

            <span>GLOWARA COLLECTION</span>

            <h1>Shop Beauty</h1>

            <p>
                Discover makeup, skincare, haircare,
                fragrance and more.
            </p>

        </section>


        <div class="shop-toolbar">

            <div class="filter-buttons">

                <button
                    class="filter-btn active"
                    data-category="All"
                >
                    All
                </button>

                <button
                    class="filter-btn"
                    data-category="Makeup"
                >
                    Makeup
                </button>

                <button
                    class="filter-btn"
                    data-category="Skincare"
                >
                    Skincare
                </button>

                <button
                    class="filter-btn"
                    data-category="Haircare"
                >
                    Haircare
                </button>

                <button
                    class="filter-btn"
                    data-category="Fragrance"
                >
                    Fragrance
                </button>

            </div>


            <select id="sortProducts" class="sort-select">

                <option value="default">
                    Sort By
                </option>

                <option value="low">
                    Price: Low to High
                </option>

                <option value="high">
                    Price: High to Low
                </option>

                <option value="rating">
                    Top Rated
                </option>

            </select>

        </div>


        <div class="shop-count">
            <span id="productCount">0</span>
            products
        </div>


        <section
            id="shopProductGrid"
            class="shop-product-grid"
        ></section>

    </main>


    <div id="toast" class="toast"></div>


    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/shop.js"></script>

</body>

</html>
