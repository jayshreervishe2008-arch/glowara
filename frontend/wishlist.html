<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glowara | Wishlist</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animation.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <style>
        .wishlist-page {
            max-width: 1250px;
            margin: auto;
            padding: 60px 25px 90px;
        }

        .wishlist-heading {
            text-align: center;
            margin-bottom: 40px;
        }

        .wishlist-heading span {
            color: #e83e8c;
            font-size: 11px;
            letter-spacing: 3px;
            font-weight: bold;
        }

        .wishlist-heading h1 {
            font-size: 38px;
            margin: 10px 0;
        }

        .wishlist-heading p {
            color: #888;
            font-size: 13px;
        }

        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
        }

        .wishlist-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
            overflow: hidden;
            transition: .35s;
        }

        .wishlist-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 18px 40px rgba(0,0,0,.10);
        }

        .wishlist-image {
            height: 320px;
            overflow: hidden;
            background: #f8f8f8;
        }

        .wishlist-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: .5s;
        }

        .wishlist-card:hover .wishlist-image img {
            transform: scale(1.06);
        }

        .wishlist-info {
            padding: 17px;
        }

        .wishlist-brand {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .wishlist-name {
            margin: 8px 0;
            font-size: 14px;
            line-height: 1.4;
        }

        .wishlist-price {
            font-weight: bold;
            font-size: 17px;
        }

        .wishlist-old-price {
            margin-left: 8px;
            text-decoration: line-through;
            color: #999;
            font-size: 12px;
        }

        .wishlist-actions {
            display: flex;
            gap: 8px;
            margin-top: 13px;
        }

        .wishlist-cart-btn,
        .wishlist-remove-btn {
            flex: 1;
            padding: 11px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .wishlist-cart-btn {
            border: none;
            background: #111;
            color: #fff;
        }

        .wishlist-cart-btn:hover {
            background: #e83e8c;
        }

        .wishlist-remove-btn {
            border: 1px solid #ddd;
            background: #fff;
            color: #444;
        }

        .wishlist-remove-btn:hover {
            border-color: #e83e8c;
            color: #e83e8c;
        }

        .empty-wishlist {
            text-align: center;
            padding: 100px 20px;
        }

        .empty-wishlist i {
            font-size: 55px;
            color: #e83e8c;
            margin-bottom: 20px;
        }

        .empty-wishlist h2 {
            margin-bottom: 10px;
        }

        .empty-wishlist p {
            color: #888;
        }

        .wishlist-shop-btn {
            display: inline-block;
            margin-top: 22px;
            padding: 13px 24px;
            background: #111;
            color: #fff;
            border-radius: 6px;
        }

        @media (max-width: 1000px) {
            .wishlist-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 700px) {
            .wishlist-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .wishlist-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header class="header">

        <div class="header-main">

            <a href="index.html" class="logo">
                <span>G</span>LOWARA
            </a>

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    placeholder="Search products..."
                >

            </div>

            <div class="header-actions">

                <a href="login.html">
                    <i class="fa-regular fa-user"></i>
                    <span>Account</span>
                </a>

                <a href="cart.html">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span>Bag</span>
                    <b id="cartCount">0</b>
                </a>

            </div>

        </div>

        <nav class="navbar">

            <a href="index.html">Home</a>
            <a href="shop.html">Makeup</a>
            <a href="shop.html">Skincare</a>
            <a href="shop.html">Haircare</a>
            <a href="shop.html">Fragrance</a>
            <a href="shop.html">Bath & Body</a>
            <a href="shop.html">Wellness</a>

        </nav>

    </header>


    <main class="wishlist-page">

        <div class="wishlist-heading">

            <span>YOUR FAVOURITES</span>

            <h1>My Wishlist</h1>

            <p>
                Save your favourite beauty products
                for later.
            </p>

        </div>


        <div
            id="wishlistGrid"
            class="wishlist-grid"
        ></div>

    </main>


    <div id="toast" class="toast"></div>


    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/wishlist.js"></script>

</body>

</html>
