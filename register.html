<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glowara | Create Account</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .auth-page {
            min-height: calc(100vh - 130px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;

            background:
                radial-gradient(
                    circle at 15% 25%,
                    #ffe3ef,
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 75%,
                    #fce5ee,
                    transparent 30%
                ),
                #fff;
        }

        .auth-box {
            width: 100%;
            max-width: 470px;
            background: #fff;
            padding: 40px;
            border: 1px solid #eee;
            border-radius: 15px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, .08);

            animation: registerIn .7s ease;
        }

        .auth-logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 4px;
        }

        .auth-logo span {
            color: #e83e8c;
        }

        .auth-title {
            text-align: center;
            font-size: 25px;
            margin-top: 20px;
        }

        .auth-subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            line-height: 1.6;
            margin: 10px 0 30px;
        }

        .auth-group {
            margin-bottom: 18px;
        }

        .auth-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
        }

        .auth-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
            transition: .3s;
        }

        .auth-group input:focus {
            border-color: #e83e8c;

            box-shadow:
                0 0 0 3px rgba(232, 62, 140, .08);
        }

        .register-btn {
            width: 100%;
            padding: 15px;
            border: none;
            background: #111;
            color: white;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 1px;
            transition: .3s;
        }

        .register-btn:hover {
            background: #e83e8c;
            transform: translateY(-2px);
        }

        .auth-message {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            min-height: 18px;
        }

        .auth-bottom {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #777;
        }

        .auth-bottom a {
            color: #e83e8c;
            font-weight: 700;
        }

        @keyframes registerIn {
            from {
                opacity: 0;
                transform: translateY(25px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>

</head>

<body>

    <main class="auth-page">

        <div class="auth-box">

            <div class="auth-logo">
                <span>G</span>LOWARA
            </div>

            <h1 class="auth-title">
                Create Account
            </h1>

            <p class="auth-subtitle">
                Join Glowara and discover your
                perfect beauty essentials.
            </p>

            <form id="registerForm">

                <div class="auth-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

                <div class="auth-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="auth-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        required
                        minlength="6"
                    >

                </div>

                <div class="auth-group">

                    <label>Confirm Password</label>

                    <input
                        type="password"
                        id="registerConfirmPassword"
                        placeholder="Confirm your password"
                        required
                        minlength="6"
                    >

                </div>

                <button
                    type="submit"
                    class="register-btn"
                >
                    CREATE ACCOUNT
                </button>

            </form>

            <div
                id="registerMessage"
                class="auth-message"
            ></div>

            <div class="auth-bottom">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </main>

    <script src="js/auth.js"></script>

</body>

</html>
